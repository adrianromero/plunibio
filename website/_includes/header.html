<a class="skip-link" href="#main-content">{{ include.t.skip }}</a>
<header class="site-header">
  <div class="shell header-inner">
    <a class="brand" href="{{ '/' | append: page.lang | append: '/' | relative_url }}" aria-label="{{ include.t.home }}">
      <img class="brand-logo" src="{{ '/assets/images/plunibio-logo-96.png' | relative_url }}" width="40" height="40" alt="" aria-hidden="true">
      <span>Plunibio</span>
    </a>
    <nav class="main-nav" aria-label="{{ include.t.primary_nav }}">
      <a {% if page.section == 'features' %}aria-current="page"{% endif %} href="{{ '/' | append: page.lang | append: '/features/' | relative_url }}">{{ include.t.features }}</a>
      <a {% if page.section == 'installation' %}aria-current="page"{% endif %} href="{{ '/' | append: page.lang | append: '/install/' | relative_url }}">{{ include.t.installation }}</a>
      <a {% if page.section == 'docs' %}aria-current="page"{% endif %} href="{{ '/' | append: page.lang | append: '/docs/' | relative_url }}">{{ include.t.docs }}</a>
      <a {% if page.section == 'about' %}aria-current="page"{% endif %} href="{{ '/' | append: page.lang | append: '/about/' | relative_url }}">{{ include.t.about }}</a>
    </nav>
    <div class="header-actions">
      {% include language-switcher.html t=include.t %}
      <a class="github-link" href="{{ site.github_url }}" rel="noopener noreferrer">
        {% include icon.html name="github" %}<span>{{ include.t.github }}</span>
      </a>
    </div>
  </div>
</header>
