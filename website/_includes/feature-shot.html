<figure class="feature-shot">
  <button
    class="feature-shot-button"
    type="button"
    data-image-viewer-trigger
    aria-label="{{ page.image_viewer_open }}: {{ include.label }}"
  >
    <img
      src="{{ '/assets/images/' | append: include.image | relative_url }}"
      width="1024"
      height="768"
      alt="{{ include.alt }}"
      loading="lazy"
    >
  </button>
</figure>
