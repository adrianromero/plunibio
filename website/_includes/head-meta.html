{% assign translated_pages = site.pages | where: "translation_key", page.translation_key %}
{% for translated_page in translated_pages %}
  {% if translated_page.lang %}<link rel="alternate" hreflang="{{ translated_page.lang }}" href="{{ translated_page.url | absolute_url }}">{% endif %}
{% endfor %}
{% if page.lang == "en" %}<link rel="alternate" hreflang="x-default" href="{{ page.url | absolute_url }}">{% endif %}
