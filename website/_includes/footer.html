<footer class="site-footer">
  <div class="shell footer-inner">
    <div>
      <a class="brand footer-brand" href="{{ '/' | append: page.lang | append: '/' | relative_url }}">
        <img class="brand-logo" src="{{ '/assets/images/plunibio-logo-96.png' | relative_url }}" width="32" height="32" alt="" aria-hidden="true"><span>Plunibio</span>
      </a>
      <p>{{ include.t.footer_tagline }}</p>
    </div>
    <div class="footer-links">
      <a href="{{ site.github_url }}">{{ include.t.source }}</a>
      <a href="{{ site.license_url }}">{{ include.t.license }}</a>
    </div>
  </div>
</footer>
