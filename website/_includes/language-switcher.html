<div class="language-switcher" aria-label="{{ include.t.language }}">
  {% assign translated_pages = site.pages | where: "translation_key", page.translation_key %}
  {% for translated_page in translated_pages %}
    {% if translated_page.lang and translated_page.lang != page.lang %}
      <a href="{{ translated_page.url | relative_url }}" hreflang="{{ translated_page.lang }}" lang="{{ translated_page.lang }}">
        {% if translated_page.lang == "es" %}ES{% else %}EN{% endif %}
      </a>
    {% endif %}
  {% endfor %}
</div>
