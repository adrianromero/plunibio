---
layout: default
---
<header class="page-hero features-hero">
  <div class="shell">
    <p class="eyebrow">{{ page.eyebrow }}</p>
    <h1>{{ page.title }}</h1>
    <p class="features-hero-intro">{{ page.intro }}</p>
    <nav class="features-jump" aria-label="{{ page.overview_label }}">
      {% for item in page.feature_nav %}
        <a href="{{ item.href }}">{{ item.label }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
<div class="features-page shell">
  {{ content }}
</div>

<div class="image-viewer" data-image-viewer role="dialog" aria-modal="true" aria-label="{{ page.image_viewer_label }}" hidden>
  <button class="image-viewer-close" type="button" data-image-viewer-close aria-label="{{ page.image_viewer_close }}">&times;</button>
  <img data-image-viewer-image alt="">
</div>

<script src="{{ '/assets/js/feature-viewer.js' | relative_url }}" defer></script>
