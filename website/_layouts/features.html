---
layout: default
---
<header class="page-hero features-hero">
  <div class="shell">
    <p class="eyebrow">{{ page.eyebrow }}</p>
    <h1>{{ page.title }}</h1>
    <p class="features-hero-intro">{{ page.intro }}</p>
    <nav class="features-jump" aria-label="{{ page.overview_label }}">
      {% for item in page.feature_nav %}
        <a href="{{ item.href }}">{{ item.label }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
<div class="features-page shell">
  {{ content }}
</div>
