name: Publicar aplicación de escritorio

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-version:
    name: Validar versión
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: npm

      - name: Comprobar la versión del tag
        run: npm run release:check -- "${{ github.ref_name }}"

  build:
    name: Construir ${{ matrix.name }}
    needs: validate-version
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            platform: ubuntu-22.04
            rust_target: ""
            args: "--bundles deb,appimage"
            apple_signing_identity: ""

          - name: macOS Apple Silicon
            platform: macos-latest
            rust_target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin --bundles app,dmg"
            apple_signing_identity: "-"

          - name: macOS Intel
            platform: macos-latest
            rust_target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin --bundles app,dmg"
            apple_signing_identity: "-"

          - name: Windows x86_64
            platform: windows-latest
            rust_target: ""
            args: "--bundles nsis,msi"
            apple_signing_identity: ""

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: npm

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Restaurar la caché de Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Instalar dependencias de Linux
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Instalar dependencias del frontend
        run: npm ci

      - name: Construir y adjuntar los instaladores
        uses: tauri-apps/tauri-action@v1
        env:
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Plunibio ${{ github.ref_name }}
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "[name]-[version]-[platform]-[arch]-[bundle]"
          args: ${{ matrix.args }}
